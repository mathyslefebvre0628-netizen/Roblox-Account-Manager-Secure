name: Build Secure EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, security-hardening ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout secure build repo
        uses: actions/checkout@v4

      - name: Prepare hardened source
        shell: pwsh
        run: ./build-secure.ps1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore solution packages
        shell: pwsh
        working-directory: ${{ runner.temp }}/roblox-account-manager-upstream
        run: |
          nuget restore '.\RBX Alt Manager.sln' -NonInteractive -Verbosity minimal

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild executable was not found on the Windows runner.' }
          "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $msbuild"

      - name: Build Release
        shell: pwsh
        working-directory: ${{ runner.temp }}/roblox-account-manager-upstream
        run: |
          & $env:MSBUILD_PATH '.\RBX Alt Manager.sln' /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackagesConfig=true /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect EXE
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'roblox-account-manager-upstream'
          $exe = Get-ChildItem $root -Recurse -Filter '*.exe' | Where-Object { $_.FullName -match 'bin\\Release' -and $_.Name -notmatch 'vshost' } | Select-Object -First 1
          if (-not $exe) { throw 'Release EXE was not produced.' }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe.FullName 'artifact/Roblox-Account-Manager-Secure.exe'
          $hash = Get-FileHash 'artifact/Roblox-Account-Manager-Secure.exe' -Algorithm SHA256
          $hash | Format-List
          $hash.Hash | Set-Content 'artifact/SHA256.txt'

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Account-Manager-Secure
          path: artifact/
          if-no-files-found: error
